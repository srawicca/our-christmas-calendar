
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263526">
  <title>Nuestro calendario de Adviento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="intro">
      <p class="eyebrow">Una pequeña sorpresa cada día</p>
      <h1>Nuestro calendario<br><em>de Adviento</em></h1>
      <p class="subtitle">24 días para llenar diciembre de recuerdos, cariño y magia.</p>
      <div class="ornament" aria-hidden="true">✦ ❧ ✦</div>
    </header>

    <section class="calendar-wrap" aria-label="Calendario de Adviento">
      <div class="calendar" id="calendar"></div>
    </section>

    <footer class="footer-note">
      Hecho con cariño, para ti <span>♥</span>
    </footer>
  </main>

  <!-- Música de fondo -->
  <audio id="backgroundMusic" loop preload="auto">
    <source src="1109,7%20Km(Acoustic).MP3" type="audio/mpeg">
    Tu navegador no puede reproducir este archivo de audio.
  </audio>

  <!-- Botón para encender y apagar la música -->
  <button
    id="musicButton"
    class="music-button"
    type="button"
    aria-label="Activar música"
    aria-pressed="false"
    title="Activar música"
  >
    <span aria-hidden="true">♫</span>
  </button>

  <dialog class="letter-dialog" id="letterDialog">
    <button class="close-dialog" id="closeDialog" aria-label="Cerrar">×</button>

    <div class="opening-scene" id="openingScene">
      <div class="big-envelope" id="bigEnvelope" aria-hidden="true">
        <div class="envelope-back"></div>
        <div class="envelope-letter"></div>
        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-seal">✦</div>
      </div>

      <section class="revealed-letter" id="revealedLetter" aria-live="polite">
        <p class="letter-kicker" id="letterKicker">Una sorpresa para ti</p>
        <h2 id="letterTitle">Día 1</h2>
        <div class="letter-content" id="letterContent"></div>
      </section>
    </div>
  </dialog>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="music.js"></script>
</body>
</html>
